# Sirve el frontend y reenvía /api y /fotos a la API, igual que vite.config.js en desarrollo.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 100m;

    # IP real del cliente cuando hay delante un proxy con HTTPS (Caddy, Traefik…): sin esto, todas las
    # peticiones llegarían con la IP del proxy y compartirían el mismo límite de intentos de la API.
    # Solo se cree el X-Forwarded-For que viene de redes privadas o del propio equipo, donde está ese proxy;
    # por eso en producción el puerto se publica solo en 127.0.0.1 (docker-compose.prod.yml).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # SignalR (tiempo real) necesita WebSocket. «^~» hace que esta regla gane a la expresión regular de abajo.
    location ^~ /api/tiempo-real {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }

    location ~ ^/(api|fotos)/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        # Se reemplaza (no se agrega) para que el cliente no pueda falsear su IP ante el límite de intentos.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Rutas de la aplicación (/subastas/4, /mis-pujas…): las resuelve Vue Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
